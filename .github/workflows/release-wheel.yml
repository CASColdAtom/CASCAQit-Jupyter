name: Release Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0a1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-wheel-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and upload wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CASCAQIT_RELEASE: v1.0.5a
      CASCAQIT_WHEEL: cascaqit-1.0.5a0-py3-none-any.whl
      CASCAQIT_WHEEL_SHA256: af665bcd8dc81d7afe1370c1acee656dcc3192b63552429692655dc0159ee97e
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify release tag and project version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match project version {version!r}; "
                  f"expected {expected_tag!r}"
              )
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run typecheck
          npm run test:frontend
          npm audit --audit-level=moderate

      - name: Download released CASCAQit wheel
        env:
          GH_TOKEN: ${{ secrets.CASCAQIT_CORE_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "CASCAQIT_CORE_TOKEN must grant read-only access to CASColdAtom/CASCAQit." >&2
            exit 1
          fi
          mkdir -p /tmp/cascaqit-core-wheel
          gh release download "${CASCAQIT_RELEASE}" \
            --repo CASColdAtom/CASCAQit \
            --pattern "${CASCAQIT_WHEEL}" \
            --dir /tmp/cascaqit-core-wheel
          printf '%s  %s\n' \
            "${CASCAQIT_WHEEL_SHA256}" \
            "/tmp/cascaqit-core-wheel/${CASCAQIT_WHEEL}" \
            | sha256sum --check --status

      - name: Install build and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade build
          python -m pip install \
            "/tmp/cascaqit-core-wheel/${CASCAQIT_WHEEL}" \
            ".[test]"

      - name: Verify Python companion
        run: |
          ruff check src tests
          python -m mypy
          python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("cascaqit_jupyter-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found: {wheels}")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())

          required_python_file = "cascaqit_jupyter/__init__.py"
          if required_python_file not in names:
              raise SystemExit(f"wheel is missing {required_python_file}")
          if not any(
              "/share/jupyter/labextensions/@cascaqit/jupyter/" in name
              for name in names
          ):
              raise SystemExit(
                  "wheel is missing the @cascaqit/jupyter prebuilt labextension"
              )
          PY

      - name: Generate checksums
        run: |
          cd dist
          sha256sum cascaqit_jupyter-*.whl > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/cascaqit_jupyter-*.whl \
            dist/SHA256SUMS \
            --clobber
