name: Internal Codespaces Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify private Core installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify private Core credential
        env:
          GH_TOKEN: ${{ secrets.CASCAQIT_CORE_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "CASCAQIT_CORE_TOKEN must grant read-only access to CASColdAtom/CASCAQit." >&2
            exit 1
          fi

      - name: Install and verify Codespaces dependencies
        env:
          GH_TOKEN: ${{ secrets.CASCAQIT_CORE_TOKEN }}
        run: bash .devcontainer/post-create.sh
