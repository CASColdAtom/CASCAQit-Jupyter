[build-system]
requires = [
    "hatch-jupyter-builder>=0.9,<1",
    "hatchling>=1.27",
    "jupyterlab>=4.5,<5",
]
build-backend = "hatchling.build"

[project]
name = "cascaqit-jupyter"
version = "0.1.0a1"
description = "JupyterLab 4 and Notebook 7 integration for CASCAQit"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "CASCAQit Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cascaqit>=1.0.5a,<1.1",
    "jsonschema>=4.18,<5",
    "typing-extensions>=4.5,<5",
]

[project.optional-dependencies]
lab = [
    "jupyterlab>=4,<5",
    "notebook>=7,<8",
]
test = [
    "build>=1.2",
    "mypy>=1.18,<2",
    "packaging>=24",
    "pytest>=8,<9",
    "ruff>=0.9",
    "types-jsonschema>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cascaqit_jupyter"]

[tool.hatch.build.targets.wheel.shared-data]
"src/cascaqit_jupyter/labextension" = "share/jupyter/labextensions/@cascaqit/jupyter"

[tool.hatch.build.targets.sdist]
include = [
    "labextension",
    "examples",
    "src/cascaqit_jupyter",
    "tests",
    "LICENSE",
    "README.md",
    "package-lock.json",
    "package.json",
    "playwright.config.ts",
    "pyproject.toml",
    "tsconfig.json",
    "tsconfig.test.json",
]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = [
    "hatch-jupyter-builder>=0.9,<1",
    "jupyterlab>=4.5,<5",
]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/cascaqit_jupyter/labextension/package.json",
    "src/cascaqit_jupyter/labextension/static/style.js",
]
skip-if-exists = [
    "src/cascaqit_jupyter/labextension/package.json",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["--strict-markers", "--strict-config"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/cascaqit_jupyter", "tests/python"]

[[tool.mypy.overrides]]
module = ["bokeh", "bokeh.*"]
follow_imports = "skip"
